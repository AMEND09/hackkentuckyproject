services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routewise}
      POSTGRES_USER: ${POSTGRES_USER:-routewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routewise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - routewise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routewise} -d ${POSTGRES_DB:-routewise}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: routewise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  routewise_pgdata:
