# RouteWise production deploy — web + backend with a single `docker compose up --build`.
#
# Usage:
#   cp .env.example .env   # then set DJANGO_SECRET_KEY to a real secret
#   docker compose up --build
#
#   Web: http://localhost:8080   API: http://localhost:8000/api/v1/
#
# Mobile (Expo) still runs on the host: point EXPO_PUBLIC_API_URL at your LAN IP.
name: routewise

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routewise}
      POSTGRES_USER: ${POSTGRES_USER:-routewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routewise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routewise} -d ${POSTGRES_DB:-routewise}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-routewise-hackathon-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-routewise}:${POSTGRES_PASSWORD:-routewise}@postgres:5432/${POSTGRES_DB:-routewise}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      DB_WAIT_HOST: postgres
      DB_WAIT_PORT: "5432"
      REDIS_WAIT_HOST: redis
      REDIS_WAIT_PORT: "6379"
      MODEL_ARTIFACT_DIRECTORY: /app/model_artifacts
      USE_STREET_MATRIX: ${USE_STREET_MATRIX:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      TRAIN_ML_ON_BOOT: ${TRAIN_ML_ON_BOOT:-true}
      # Plain-HTTP local deploy: relax secure cookies (keep true behind TLS).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
    volumes:
      - model_artifacts:/app/model_artifacts
      - backend_media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 20

  celery:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-routewise-hackathon-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-routewise}:${POSTGRES_PASSWORD:-routewise}@postgres:5432/${POSTGRES_DB:-routewise}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      DB_WAIT_HOST: postgres
      DB_WAIT_PORT: "5432"
      REDIS_WAIT_HOST: redis
      REDIS_WAIT_PORT: "6379"
      MODEL_ARTIFACT_DIRECTORY: /app/model_artifacts
      USE_STREET_MATRIX: ${USE_STREET_MATRIX:-true}
      # Backend owns one-time setup; the worker just waits for it.
      SEED_DEMO: "false"
      TRAIN_ML_ON_BOOT: "false"
    volumes:
      - model_artifacts:/app/model_artifacts
      - backend_media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional self-hosted OSRM for street routing without the public demo
  # endpoint. Build an extract first (needs ~2GB RAM), then:
  #   docker compose --profile osrm up -d
  #   OSRM_BASE_URL=http://osrm:5000 (backend env) to use it.
  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 500 /data/region.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"

volumes:
  pgdata:
  model_artifacts:
  backend_media:
